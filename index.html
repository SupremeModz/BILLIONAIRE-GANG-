<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 Not Found</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }
  h1 {
    font-size: 70px;
    margin: 0;
  }
  .box {
    background: #1a1a1a;
    padding: 25px;
    border-radius: 8px;
    border: 1px solid #333;
  }
  p {
    margin: 8px 0;
    opacity: 0.8;
  }
  .blink {
    animation: blink 1s infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="box">
  <h1>404</h1>
  <p><strong>Page Not Found</strong></p>
  <p class="blink">Sorry, site is under maintenance 🚧</p>
  <p>Try again later</p>
</div>
</body>
</html>
